<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0b9467" />
  <title>Admin · Dipti Medical</title>
  <link rel="icon" type="image/png" href="/img/favicon-64.png" />
  <link rel="apple-touch-icon" href="/img/apple-touch-icon.png" />
  <link rel="manifest" href="/manifest.webmanifest" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/css/styles.css" />
  <link rel="stylesheet" href="/css/admin.css" />
  <script type="module" src="/js/admin/app.js"></script>
</head>
<body class="admin">
  <div id="splash" class="splash" role="status" aria-live="polite">
    <img class="splash__brand" src="/img/logo-full.png" alt="Dipti Medical" width="200" height="182" />
    <p class="splash__tag">Admin panel</p>
    <div class="splash__bar"><span></span></div>
    <p class="splash__status" id="splashStatus">Checking access…</p>
  </div>

  <div class="shell">
    <aside class="sidebar" id="sidebar" aria-label="Main navigation">
      <div class="sidebar__brand">
        <img src="/img/logo-mark.png" alt="" width="36" height="36" />
        <div><strong>Dipti Medical</strong><span>Admin</span></div>
      </div>
      <nav id="nav" class="nav"></nav>
      <div class="sidebar__user">
        <img id="meAvatar" alt="" width="36" height="36" />
        <div class="sidebar__who"><strong id="meName"></strong><span id="meRole"></span></div>
        <button id="signOut" class="icon-btn" type="button" aria-label="Sign out" title="Sign out">
          <svg viewBox="0 0 24 24"><path d="M10 17l1.4-1.4-2.6-2.6H20v-2H8.8l2.6-2.6L10 7l-5 5 5 5zM4 5h8V3H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h8v-2H4z"/></svg>
        </button>
      </div>
    </aside>
    <div class="scrim" id="scrim" hidden></div>

    <div class="main">
      <header class="appbar">
        <button id="menuBtn" class="icon-btn appbar__menu" type="button" aria-label="Open menu" aria-controls="sidebar" aria-expanded="false">
          <svg viewBox="0 0 24 24"><path d="M3 6h18v2H3zm0 5h18v2H3zm0 5h18v2H3z"/></svg>
        </button>
        <h1 id="pageTitle" class="appbar__title">Dashboard</h1>
        <div id="pageActions" class="appbar__actions"></div>
      </header>
      <main id="view" class="view" tabindex="-1"></main>
    </div>
  </div>

  <div id="modalRoot"></div>
  <div id="printArea" class="print-area" aria-hidden="true"></div>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
</body>
</html>
